<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Schedulers · Level 1 · Revised organization</title><style>
:root{color-scheme:dark light;font:17px/1.5 system-ui;background:#0c1120;color:#edf2ff}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:48px 24px 100px}h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.2;max-width:950px}p{white-space:pre-wrap;color:#bfcae1}.eyebrow{color:#9caeff;letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0}.card{min-width:0;background:#151d30;border:1px solid #39445f;border-radius:16px;padding:20px}.card:has(input:checked){border-color:#a9b9ff;box-shadow:0 0 0 2px #a9b9ff}.choice{display:flex;gap:12px;cursor:pointer;align-items:flex-start}.choice input{margin-top:7px;accent-color:#b5c2ff}strong,em{display:block}em{font-size:.75rem;color:#a9b9ff}button,textarea{font:inherit}button{border:1px solid #8498d0;border-radius:9px;padding:10px 18px;background:#b8c7ff;color:#111a30;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffce6a;outline-offset:4px}button:disabled{opacity:.6;cursor:wait}.expand{display:block;width:100%;padding:0;overflow:hidden;background:#090d17}.expand img{width:100%;display:block;max-height:360px;object-fit:contain}.review-video{display:block;width:100%;max-height:70vh;background:#000}a{color:inherit}figure{margin:16px 0}figcaption{font-size:.85rem;color:inherit;opacity:.8;margin-top:8px}iframe{width:100%;height:400px;border:1px solid #455274;background:#fff}textarea{display:block;width:100%;min-height:130px;background:#151d30;color:#edf2ff;border:1px solid #64749c;border-radius:10px;padding:14px;margin:10px 0 20px}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{background:transparent;color:#cbd6f1}#status{margin-top:16px;white-space:pre-wrap}dialog{max-width:96vw;max-height:96vh;background:#111a2c;color:#fff;border:1px solid #8a9bc9;border-radius:12px}dialog img{display:block;max-width:88vw;max-height:80vh;object-fit:contain}.close{float:right}footer{margin-top:32px;font-size:.8rem;color:#a4afc7}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:24px 16px 64px}}@media(prefers-color-scheme:light){:root{background:#f4f6fc;color:#122042}.card,textarea{background:white;color:#122042}p{color:#4c5b78}.secondary{color:#223665}iframe{border-color:#bdc7df}}</style></head><body><main><div class="eyebrow">A question for you</div><h1>Which revised layout works best with Workspace as a dropdown and Enabled last?</h1><figure><p>Both changes are now fixed: Workspace is a dropdown, and Enabled is the final standalone setting. B is still my recommendation because its quiet sections keep every setting visible without adding card navigation. F makes Enabled a separate fifth point if you prefer the numbered guide.</p></figure><figure><p>A remains the actual current capture for reference. B–F are revised at the same 368 × 964 panel size. All previous header/footer and real configured-model requirements remain unchanged. No layout was accepted from the earlier comments-only response.</p></figure><form id="answer"><div class="grid"><article class="card"><label class="choice"><input type="radio" name="choice" value="A"><span><strong>A · Existing flat structure</strong></span></label><figure><p>Actual current baseline. Choosing this retains the flat organization but still applies your dropdown, final Enabled, header, and footer requirements.</p></figure><figure><button class="expand" type="button" data-image="0" aria-label="Expand image: Actual current native panel, retained as the flat-structure reference"><img src="assets/0484326f8357c4bda8205868fb2c50c6ca82c5784e8f7db64093e1ae91ebe7a8.png" alt="Actual current native panel, retained as the flat-structure reference"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="B"><span><strong>B · Quiet sections — recommended</strong><em>Recommended</em></span></label><figure><p>Task, Location, Schedule, Runner, then a separate Enabled row. Clear grouping with minimal visual weight.</p></figure><figure><button class="expand" type="button" data-image="1" aria-label="Expand image: Quiet sections with Workspace dropdown and separate final Enabled setting"><img src="assets/8682c0b7b6fc15ecff0c055f536bce583478c9ec437fbc94a0b1b1b4a369b25f.png" alt="Quiet sections with Workspace dropdown and separate final Enabled setting"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="C"><span><strong>C · Compact label rows</strong></span></label><figure><p>Dense settings rows, full-width dropdowns, and Enabled isolated at the end. Compact, but long text has less room.</p></figure><figure><button class="expand" type="button" data-image="2" aria-label="Expand image: Compact label rows with Workspace dropdown and final separate Enabled row"><img src="assets/7bde4a5ed87909fa863393305f688420477ce47726cb23c8aceb3616888c8a7a.png" alt="Compact label rows with Workspace dropdown and final separate Enabled row"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="D"><span><strong>D · Expandable group cards</strong></span></label><figure><p>Four expandable groups followed by a separate Enabled card. Strong boundaries, with more borders and interaction.</p></figure><figure><button class="expand" type="button" data-image="3" aria-label="Expand image: Expanded group cards with Workspace dropdown and final independent Enabled card"><img src="assets/f55810cbe28f98f4d64c342afa242032d03bf94b525dd7817dd2ac437aa7a3a4.png" alt="Expanded group cards with Workspace dropdown and final independent Enabled card"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="E"><span><strong>E · Task recipe</strong></span></label><figure><p>Run, In, Every, Using cards, with Enabled outside the recipe at the end. Conversational, but less like native settings.</p></figure><figure><button class="expand" type="button" data-image="4" aria-label="Expand image: Task recipe cards with Workspace dropdown and standalone final Enabled row"><img src="assets/ef7f1f35ebe66daea3a04508cff54e563123ba477ecfcfa7884d7ba3b1699904.png" alt="Task recipe cards with Workspace dropdown and standalone final Enabled row"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="F"><span><strong>F · Five-point planning rail</strong></span></label><figure><p>Describe, environment, rhythm, runner, then Enable the task as point five. Clear progression without separate pages.</p></figure><figure><button class="expand" type="button" data-image="5" aria-label="Expand image: Numbered five-point planning rail with Workspace dropdown and Enabled in its own last point"><img src="assets/46a56e4b646e0f9b86bf11d2cbbe6ae12a2e9350b86f881a59b27e39bbe19ac8.png" alt="Numbered five-point planning rail with Workspace dropdown and Enabled in its own last point"></button></figure></article></div><label for="comments">Comments / why <span>(or tell us why none fit)</span></label><textarea id="comments" placeholder="Explain your preference, combine ideas, or suggest something else"></textarea><div class="actions"><button id="submit" type="submit" disabled>Send response</button><button class="secondary" id="clear" type="button">Clear selection</button></div><div id="status" role="status" aria-live="polite"></div></form><footer>Choose one option. Comments-only responses are welcome. Served only on this machine.</footer></main><dialog id="viewer"><button type="button" class="close" id="close">Close</button><h2 id="image-title"></h2><img id="full-image" alt=""></dialog><script>
const config={"question":"scheduler-form-01a1afcd-B2","revision":"ba6aca39d6a13d86f6667b9545d08aa0dd36da0f5d7e503ca944e90de9e379ae","backend":"local","capability":"BLd9WA2KiIwLSvgWLJCeGi2NFMJDQJe7plES8Qm46zo","images":[{"image":"assets/0484326f8357c4bda8205868fb2c50c6ca82c5784e8f7db64093e1ae91ebe7a8.png","label":"Actual current native panel, retained as the flat-structure reference"},{"image":"assets/8682c0b7b6fc15ecff0c055f536bce583478c9ec437fbc94a0b1b1b4a369b25f.png","label":"Quiet sections with Workspace dropdown and separate final Enabled setting"},{"image":"assets/7bde4a5ed87909fa863393305f688420477ce47726cb23c8aceb3616888c8a7a.png","label":"Compact label rows with Workspace dropdown and final separate Enabled row"},{"image":"assets/f55810cbe28f98f4d64c342afa242032d03bf94b525dd7817dd2ac437aa7a3a4.png","label":"Expanded group cards with Workspace dropdown and final independent Enabled card"},{"image":"assets/ef7f1f35ebe66daea3a04508cff54e563123ba477ecfcfa7884d7ba3b1699904.png","label":"Task recipe cards with Workspace dropdown and standalone final Enabled row"},{"image":"assets/46a56e4b646e0f9b86bf11d2cbbe6ae12a2e9350b86f881a59b27e39bbe19ac8.png","label":"Numbered five-point planning rail with Workspace dropdown and Enabled in its own last point"}]};const form=document.getElementById('answer'),status=document.getElementById('status'),submit=document.getElementById('submit'),commentsField=document.getElementById('comments');let sending=false;
function updateSubmit(){submit.disabled=sending||(!form.querySelector('input:checked')&&!commentsField.value.trim())}form.addEventListener('input',updateSubmit);form.addEventListener('change',updateSubmit);updateSubmit();
const clearButton=document.getElementById('clear');if(clearButton)clearButton.onclick=()=>{form.querySelectorAll('input').forEach(e=>e.checked=false);commentsField.focus();updateSubmit()};
document.querySelectorAll('[data-image]').forEach(button=>button.onclick=()=>{const item=config.images[Number(button.dataset.image)];document.getElementById('image-title').textContent=item.label;const image=document.getElementById('full-image');image.src=item.image;image.alt=item.label;document.getElementById('viewer').showModal()});
document.getElementById('close').onclick=()=>document.getElementById('viewer').close();
form.onsubmit=async event=>{event.preventDefault();const selected_ids=[...form.querySelectorAll('input:checked')].map(e=>e.value);const comments=commentsField.value;if(!selected_ids.length&&!comments.trim()){status.textContent='Choose an option or add comments.';return}const payload={question:config.question,revision:config.revision,selected_ids:config.backend==='here.now'?JSON.stringify(selected_ids):selected_ids,comments};const body=JSON.stringify(payload);if(config.backend==='here.now'&&new TextEncoder().encode(body).length>16384){status.textContent='here.now allows 16 KB per answer record. Your response was not sent or shortened. Please shorten the comments.';return}sending=true;updateSubmit();status.textContent='Sending…';try{const headers={'Content-Type':'application/json'};if(config.backend==='local')headers['X-Decision-Capability']=config.capability;const response=await fetch(config.backend==='local'?'/answer':'/.herenow/data/answers',{method:'POST',headers,body});if(!response.ok)throw new Error('Submission failed ('+response.status+'). '+await response.text());status.textContent='Response saved. You can return to Pi.';form.querySelectorAll('button,input,textarea').forEach(e=>e.disabled=true)}catch(error){status.textContent=error.message;sending=false;updateSubmit()}};
</script></body></html>
