<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Schedulers · Level 1 · Form organization</title><style>
:root{color-scheme:dark light;font:17px/1.5 system-ui;background:#0c1120;color:#edf2ff}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:48px 24px 100px}h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.2;max-width:950px}p{white-space:pre-wrap;color:#bfcae1}.eyebrow{color:#9caeff;letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0}.card{min-width:0;background:#151d30;border:1px solid #39445f;border-radius:16px;padding:20px}.card:has(input:checked){border-color:#a9b9ff;box-shadow:0 0 0 2px #a9b9ff}.choice{display:flex;gap:12px;cursor:pointer;align-items:flex-start}.choice input{margin-top:7px;accent-color:#b5c2ff}strong,em{display:block}em{font-size:.75rem;color:#a9b9ff}button,textarea{font:inherit}button{border:1px solid #8498d0;border-radius:9px;padding:10px 18px;background:#b8c7ff;color:#111a30;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffce6a;outline-offset:4px}button:disabled{opacity:.6;cursor:wait}.expand{display:block;width:100%;padding:0;overflow:hidden;background:#090d17}.expand img{width:100%;display:block;max-height:360px;object-fit:contain}.review-video{display:block;width:100%;max-height:70vh;background:#000}a{color:inherit}figure{margin:16px 0}figcaption{font-size:.85rem;color:inherit;opacity:.8;margin-top:8px}iframe{width:100%;height:400px;border:1px solid #455274;background:#fff}textarea{display:block;width:100%;min-height:130px;background:#151d30;color:#edf2ff;border:1px solid #64749c;border-radius:10px;padding:14px;margin:10px 0 20px}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{background:transparent;color:#cbd6f1}#status{margin-top:16px;white-space:pre-wrap}dialog{max-width:96vw;max-height:96vh;background:#111a2c;color:#fff;border:1px solid #8a9bc9;border-radius:12px}dialog img{display:block;max-width:88vw;max-height:80vh;object-fit:contain}.close{float:right}footer{margin-top:32px;font-size:.8rem;color:#a4afc7}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:24px 16px 64px}}@media(prefers-color-scheme:light){:root{background:#f4f6fc;color:#122042}.card,textarea{background:white;color:#122042}p{color:#4c5b78}.secondary{color:#223665}iframe{border-color:#bdc7df}}</style></head><body><main><div class="eyebrow">A question for you</div><h1>Which New task form organization fits this right-hand panel best?</h1><figure><p>I recommend B: quiet sections make the form easier to scan without adding navigation or hiding settings. The tradeoff is a little more vertical space than the current form. All six views use the actual 368 × 964 panel size.</p></figure><figure><p>Your header/footer changes and real model dropdown are fixed requirements, not choices. A is the actual current capture for comparison; B–F show those changes. Folder Choose… already opens the system folder picker. “Pi default” preserves the current blank model setting; the implemented dropdown will search real configured Pi models, not a hardcoded list. This question decides only how the form is organized.</p></figure><form id="answer"><div class="grid"><article class="card"><label class="choice"><input type="radio" name="choice" value="A"><span><strong>A · Current real baseline</strong></span></label><figure><p>Keep the existing flat field order. Least structural change, but related fields have little separation. Your fixed header/footer and model changes still apply.</p></figure><figure><button class="expand" type="button" data-image="0" aria-label="Expand image: Actual current native New scheduled task panel, with flat field stack"><img src="assets/0484326f8357c4bda8205868fb2c50c6ca82c5784e8f7db64093e1ae91ebe7a8.png" alt="Actual current native New scheduled task panel, with flat field stack"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="B"><span><strong>B · Quiet section stack — recommended</strong><em>Recommended</em></span></label><figure><p>Task, Location, Schedule, and Runner sections with subtle dividers. Easy to scan while keeping every setting visible.</p></figure><figure><button class="expand" type="button" data-image="1" aria-label="Expand image: New task form grouped into quiet Task, Location, Schedule, and Runner sections"><img src="assets/926e1746a1561e185888eb320cae0be52602ed0852bb989985f33468e43076cb.png" alt="New task form grouped into quiet Task, Location, Schedule, and Runner sections"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="C"><span><strong>C · Compact label rows</strong></span></label><figure><p>Labels sit beside controls for a dense settings-style form. Shorter scan, but less room for long folders and prompts.</p></figure><figure><button class="expand" type="button" data-image="2" aria-label="Expand image: New task form with compact left labels and right controls"><img src="assets/8855a4e2aa53f8671f51c797285ff205256a895eea65e775492468814f12c1ff.png" alt="New task form with compact left labels and right controls"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="D"><span><strong>D · Expandable group cards</strong></span></label><figure><p>Separate cards can collapse after setup; shown fully expanded here. Strong boundaries, with extra borders and interaction.</p></figure><figure><button class="expand" type="button" data-image="3" aria-label="Expand image: New task form in four expanded collapsible cards"><img src="assets/894eb30a5a38c63ef5104120b531b1af64bc0a006f1dc8b95c9c6f0338dfed53.png" alt="New task form in four expanded collapsible cards"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="E"><span><strong>E · Read it as a recipe</strong></span></label><figure><p>Run, In, Every, Using groups read like a task recipe. More conversational, but less like the surrounding settings UI.</p></figure><figure><button class="expand" type="button" data-image="4" aria-label="Expand image: New task form organized as a Run, In, Every, Using recipe"><img src="assets/bc924db2b326d979bdaa1f1a52247f1da840cdb433a29ad679f887f16e3796d5.png" alt="New task form organized as a Run, In, Every, Using recipe"></button></figure></article><article class="card"><label class="choice"><input type="radio" name="choice" value="F"><span><strong>F · Numbered planning rail</strong></span></label><figure><p>A vertical numbered guide explains the setup sequence without separate pages. Clear progression, at the cost of horizontal space.</p></figure><figure><button class="expand" type="button" data-image="5" aria-label="Expand image: New task form with numbered vertical planning rail and all settings visible"><img src="assets/c16dba2d4035dbdc7fa60928b32a2485bfae9bbbea710cfa7771f3240ed90c71.png" alt="New task form with numbered vertical planning rail and all settings visible"></button></figure></article></div><label for="comments">Comments / why <span>(or tell us why none fit)</span></label><textarea id="comments" placeholder="Explain your preference, combine ideas, or suggest something else"></textarea><div class="actions"><button id="submit" type="submit" disabled>Send response</button><button class="secondary" id="clear" type="button">Clear selection</button></div><div id="status" role="status" aria-live="polite"></div></form><footer>Choose one option. Comments-only responses are welcome. Served only on this machine.</footer></main><dialog id="viewer"><button type="button" class="close" id="close">Close</button><h2 id="image-title"></h2><img id="full-image" alt=""></dialog><script>
const config={"question":"scheduler-form-01a1afcd-B1","revision":"5c900c9708c1db6f39017bc8e3a9cd1a4f19b643cd891c72d4ca7ec05813b03a","backend":"local","capability":"2rwVpOH-jxv4O4N4qCnkL5xGtBasoLWmRyXJH41THf8","images":[{"image":"assets/0484326f8357c4bda8205868fb2c50c6ca82c5784e8f7db64093e1ae91ebe7a8.png","label":"Actual current native New scheduled task panel, with flat field stack"},{"image":"assets/926e1746a1561e185888eb320cae0be52602ed0852bb989985f33468e43076cb.png","label":"New task form grouped into quiet Task, Location, Schedule, and Runner sections"},{"image":"assets/8855a4e2aa53f8671f51c797285ff205256a895eea65e775492468814f12c1ff.png","label":"New task form with compact left labels and right controls"},{"image":"assets/894eb30a5a38c63ef5104120b531b1af64bc0a006f1dc8b95c9c6f0338dfed53.png","label":"New task form in four expanded collapsible cards"},{"image":"assets/bc924db2b326d979bdaa1f1a52247f1da840cdb433a29ad679f887f16e3796d5.png","label":"New task form organized as a Run, In, Every, Using recipe"},{"image":"assets/c16dba2d4035dbdc7fa60928b32a2485bfae9bbbea710cfa7771f3240ed90c71.png","label":"New task form with numbered vertical planning rail and all settings visible"}]};const form=document.getElementById('answer'),status=document.getElementById('status'),submit=document.getElementById('submit'),commentsField=document.getElementById('comments');let sending=false;
function updateSubmit(){submit.disabled=sending||(!form.querySelector('input:checked')&&!commentsField.value.trim())}form.addEventListener('input',updateSubmit);form.addEventListener('change',updateSubmit);updateSubmit();
const clearButton=document.getElementById('clear');if(clearButton)clearButton.onclick=()=>{form.querySelectorAll('input').forEach(e=>e.checked=false);commentsField.focus();updateSubmit()};
document.querySelectorAll('[data-image]').forEach(button=>button.onclick=()=>{const item=config.images[Number(button.dataset.image)];document.getElementById('image-title').textContent=item.label;const image=document.getElementById('full-image');image.src=item.image;image.alt=item.label;document.getElementById('viewer').showModal()});
document.getElementById('close').onclick=()=>document.getElementById('viewer').close();
form.onsubmit=async event=>{event.preventDefault();const selected_ids=[...form.querySelectorAll('input:checked')].map(e=>e.value);const comments=commentsField.value;if(!selected_ids.length&&!comments.trim()){status.textContent='Choose an option or add comments.';return}const payload={question:config.question,revision:config.revision,selected_ids:config.backend==='here.now'?JSON.stringify(selected_ids):selected_ids,comments};const body=JSON.stringify(payload);if(config.backend==='here.now'&&new TextEncoder().encode(body).length>16384){status.textContent='here.now allows 16 KB per answer record. Your response was not sent or shortened. Please shorten the comments.';return}sending=true;updateSubmit();status.textContent='Sending…';try{const headers={'Content-Type':'application/json'};if(config.backend==='local')headers['X-Decision-Capability']=config.capability;const response=await fetch(config.backend==='local'?'/answer':'/.herenow/data/answers',{method:'POST',headers,body});if(!response.ok)throw new Error('Submission failed ('+response.status+'). '+await response.text());status.textContent='Response saved. You can return to Pi.';form.querySelectorAll('button,input,textarea').forEach(e=>e.disabled=true)}catch(error){status.textContent=error.message;sending=false;updateSubmit()}};
</script></body></html>
